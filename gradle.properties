org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

org.gradle.tooling.parallel=true

# The release signing key is not in this file. Put these four properties in
# ~/.gradle/gradle.properties, or set them as environment variables, to sign
# a release build locally. Without them the release APK is unsigned.
#
# RELEASE_STORE_FILE=/absolute/path/to/release.jks
# RELEASE_STORE_PASSWORD=
# RELEASE_KEY_ALIAS=
# RELEASE_KEY_PASSWORD=
