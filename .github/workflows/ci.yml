name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the sources
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Read the toolchain versions
        id: toolchain
        run: |
          echo "ndk=$(grep -oP 'val ndkVersion = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "cmake=$(grep -oP 'val cmakeVersion = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;${{ steps.toolchain.outputs.ndk }} cmake;${{ steps.toolchain.outputs.cmake }}'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Check the Gradle wrapper
        run: ./gradlew --version

      # Built on its own first, so a broken CMake setup is reported clearly
      # instead of turning up as a missing asset.
      - name: Build the native library
        run: ./gradlew :app:buildCMakeDebug

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug

      # The release build is unsigned here, but it still runs R8, so a broken
      # ProGuard rule is caught before a release is ever cut.
      - name: Build the release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
